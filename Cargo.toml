# The split docs/SPEC.md describes: a core crate that depends on no platform
# binding, and a shell that does. `cargo tree -p fidget-core` is the check.

[workspace]
resolver = "2"
members = ["crates/core", "crates/mcp-server", "crates/verify", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.95 stabilizes `AtomicUsize::try_update`, the name clippy wants on stable.
# The ACP crates (ADR-0022) need 1.88.
rust-version = "1.95"
license = "MIT"

# Unoptimized PNG decoding of every installed Character held a debug launch for
# 1-2 s on a CI runner, past the scenario leaves' 3 s wait (#1765).
[profile.dev.package."*"]
opt-level = 3
