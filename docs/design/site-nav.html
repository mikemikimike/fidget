<style>
  /* A page's own sticky bar sits under the header at top: var(--site-nav-h). */
  :root { --site-nav-h: calc(3.5rem + 1px); }
  html { scroll-padding-top: calc(var(--site-nav-h) + 1rem); }
  .site-nav { display: block; margin: 0; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--line, #D3D7E0);
    background: color-mix(in srgb, var(--paper, #F4F5F8) 88%, transparent); backdrop-filter: blur(8px);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .site-nav nav { display: flex; align-items: center; gap: 1.25rem; max-width: 68rem;
    height: 3.5rem; margin: 0 auto; padding: 0 1rem; }
  .site-brand { display: flex; align-items: center; gap: .5rem; font-weight: 700;
    font-size: 1.15rem; color: var(--ink, #1D2027); text-decoration: none; margin-right: auto; }
  .site-brand img { width: 30px; height: 30px; }
  .site-link { color: var(--ink-2, #4A5060); text-decoration: none; font-size: .95rem; }
  .site-link:hover { color: var(--ink, #1D2027); }
  @media (max-width: 760px) { .site-link.opt { display: none; } }
</style>
<header class="site-nav">
  <nav>
    <a class="site-brand" href="./"><img src="{{brand}}" alt="">Fidget</a>
    <a class="site-link opt" href="./#harnesses">Harnesses</a>
    <a class="site-link opt" href="./#characters">Characters</a>
    <a class="site-link" href="https://github.com/omesser/fidget#get-it">Install</a>
    <a class="site-link opt" href="https://github.com/omesser/fidget/releases">Releases</a>
    <a class="site-link" href="https://github.com/omesser/fidget">GitHub</a>
  </nav>
</header>
