name: Secret Scanning

# TruffleHog scans the new commits and checks each hit against its issuer.
# detect-secrets, which reads the tree as it stands, is a pre-commit hook
# that PR Tests runs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The image, not trufflesecurity/trufflehog: the repo's Actions allowlist
  # does not include it. Same flags the action passes to the same image.
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        # A pull request or push scans only its own commits; a dispatch scans
        # all history. Only verified secrets fail the job.
        env:
          IMAGE: trufflesecurity/trufflehog:3.99.3@sha256:63b6120f410beb64aea4e421f1ed277248e14b2942d124df289422b623f610d8 # pragma: allowlist secret
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          range=()
          if [ "$EVENT" = pull_request ]; then
            range=(--since-commit "$PR_BASE" --branch "$PR_HEAD")
          elif [ "$EVENT" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range=(--since-commit "$PUSH_BEFORE" --branch "$PUSH_AFTER")
          fi
          docker run --rm -v "$PWD:/tmp" -w /tmp "$IMAGE" \
            git file:///tmp/ "${range[@]}" \
            --only-verified --fail --no-update --github-actions
