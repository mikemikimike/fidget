name: Security

# Advisory databases change under an untouched lockfile, so the nightly run is
# what surfaces a new advisory; pull requests and main get the same three scans.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Reads Cargo.lock and `.cargo/audit.toml` only, so the project is not built.
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the latest cargo-audit
        id: cargo-audit
        # Unpinned on purpose: each release is picked up without a bump, at the
        # cost of no checksum. crates.io refuses requests without a User-Agent.
        run: |
          version=$(curl -fsSL -A "fidget-ci (https://github.com/omesser/fidget)" \
            https://crates.io/api/v1/crates/cargo-audit | jq -r '.crate.max_stable_version')
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::crates.io returned no cargo-audit version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.cargo-audit.outputs.version }}

      - name: Install cargo-audit
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.cargo-audit.outputs.version }}
        run: cargo install cargo-audit --locked --version "$VERSION"

      - name: Cargo audit
        run: cargo audit

  # Reads package-lock.json only; nothing is installed.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: npm audit
        run: npm audit --audit-level=high

  # Every pull request, Markdown included: a pasted key is as live in a doc.
  # Known false positives sit in `.secrets.baseline` or carry
  # `pragma: allowlist secret`; only a hit in neither fails the job.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Scan for secrets
        # The hook exits 1 on a new secret and 3 when it only moved a known
        # hit's line number, which the local pre-commit hook commits.
        run: | # pragma: allowlist secret
          pip install detect-secrets==1.5.0
          mapfile -d '' files < <(git ls-files -z)
          status=0
          detect-secrets-hook --baseline .secrets.baseline "${files[@]}" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::.secrets.baseline has stale line numbers; run pre-commit locally to refresh it"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
