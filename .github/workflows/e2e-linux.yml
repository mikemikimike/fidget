name: e2e-linux

# Live runs of `scripts/scenarios/ci/*.x11.sh` on a hosted runner's Xvfb
# display. Too heavy for every pull request: it runs on dispatch or the
# `e2e-linux` label only.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      scenarios:
        description: Space-separated ci/ leaf names; empty runs them all
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Per label: another label's `labeled` run skips its job, and must not cancel
  # an e2e run in flight. Re-adding e2e-linux replaces it.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  e2e-linux:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the X11 session packages
        # The build's packages from tests.yml, then the display, window
        # managers, tray host and tools the leaves drive.
        run: |
          # The image's Chrome apt source can fail `apt-get update`; nothing here needs it.
          sudo find /etc/apt/sources.list.d -type f \
            -exec grep -lE 'dl\.google\.com' {} + 2>/dev/null \
            | sudo xargs -r rm -vf
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev \
            xvfb xfwm4 icewm picom xdotool x11-utils inotify-tools mousepad \
            ayatana-indicator-application at-spi2-core dbus-x11 python3-pyatspi python3-pil

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: e2e-linux
          cache-on-failure: true

      - name: Build the app, the test binary and fidget-verify
        # Built here so no leaf spends its 3 min cap compiling.
        run: |
          cargo build -p fidget
          cargo build -p fidget-verify
          cargo test -p fidget --no-run

      - name: Run the scenarios
        # One session bus for the AT-SPI bus, the tray watcher and every leaf.
        shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          # The leaves write evidence under $TMPDIR; keep it in one folder to upload.
          export TMPDIR="$RUNNER_TEMP/evidence" DISPLAY=:99
          mkdir -p "$TMPDIR"
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$TMPDIR/xvfb.log" 2>&1 &
          timeout 10 sh -c 'until xdpyinfo > /dev/null 2>&1; do sleep 0.1; done'
          xfwm4 > "$TMPDIR/xfwm4.log" 2>&1 &
          # Its service is the StatusNotifierWatcher the tray leaves click through.
          "$(dpkg -L ayatana-indicator-application | grep -m1 'application-service$')" \
            > "$TMPDIR/indicator.log" 2>&1 &
          gdbus wait --session --timeout 10 org.kde.StatusNotifierWatcher
          if [ -n "$SCENARIOS" ]; then
            read -r -a names <<< "$SCENARIOS"
          else
            names=()
            for leaf in scripts/scenarios/{ci,manual-only}/*.x11.sh; do
              names+=("$(basename "$leaf" .x11.sh)")
            done
          fi
          summary="" failed=0
          for name in "${names[@]}"; do
            echo "::group::scenario $name"
            code=0
            # 3 min is well past the slowest leaf's own limit. The Harness runs
            # in its own process group, which timeout does not reach.
            timeout -k 10 180 cargo run -q -p fidget-verify -- scenario "$name" --go || code=$?
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo "timed out after 3 min"
              pkill -KILL -f "$PWD/target/debug/" || true
            fi
            echo "::endgroup::"
            # A SKIP fails the job: it means the runner could not prove the leaf.
            case $code in
              0) verdict=PASS ;;
              2) verdict=SKIP ;;
              *) verdict="FAIL ($code)" ;;
            esac
            [ "$code" -eq 0 ] || failed=1
            summary+=$(printf '%-28s %s' "$name" "$verdict")$'\n'
          done
          printf '%s' "$summary"
          printf '```\n%s```\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Gather evidence
        if: always()
        # Each leaf's private HOME holds caches and sockets, and no evidence.
        run: rsync -rlt --exclude home/ "$RUNNER_TEMP/evidence/" "$RUNNER_TEMP/upload/" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-linux-evidence
          path: ${{ runner.temp }}/upload
          if-no-files-found: warn
